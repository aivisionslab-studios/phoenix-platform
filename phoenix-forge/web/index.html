<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phoenix Forge</title>
<style>body{font-family:system-ui,Segoe UI,sans-serif;margin:0;background:#0d1117;color:#e6edf3}header{padding:24px 28px;border-bottom:1px solid #30363d}main{padding:24px;max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:16px}.card h2{font-size:16px;margin:0 0 8px}.muted{color:#8b949e}.ok{color:#3fb950}.warn{color:#d29922}a{color:#58a6ff;text-decoration:none}code{font-family:ui-monospace,Consolas,monospace}</style></head><body>
<header><h1>Phoenix Forge <span id="version" class="muted"></span></h1><div class="muted">Hardware Intelligence Platform · caminho canônico <code>phoenix-forge</code></div></header>
<main><div id="status" class="card">Carregando superfície pública…</div><h2>Inspectores</h2><div id="grid" class="grid"></div></main>
<script>
async function j(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status+' '+u);return r.json()}
(async()=>{try{const [h,s]=await Promise.all([j('/health'),j('/api/public-surface')]);document.querySelector('#version').textContent='v'+h.version;document.querySelector('#status').innerHTML='<b class="ok">ONLINE</b> · '+s.sections.length+' superfícies públicas · Decision Engine <b class="warn">BLOQUEADO</b>';document.querySelector('#grid').innerHTML=s.sections.map(x=>`<div class="card"><h2>${x.title}</h2><div class="muted"><code>${x.endpoint}</code></div><p><a href="${x.endpoint}" target="_blank">Abrir JSON ↗</a></p></div>`).join('')}catch(e){document.querySelector('#status').textContent='Falha ao carregar: '+e}})();
</script></body></html>
